name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v3
    
    - name: 设置 Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5 pyinstaller
    
    - name: 打包 Windows exe
      run: |
        pyinstaller --onefile --windowed --name="视频音量统一工具" adjust_volume_gui.py
    
    - name: 上传构建产物
      uses: actions/upload-artifact@v3
      with:
        name: windows-exe
        path: dist/*.exe
