name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'  # 当推送 v1.0.0, v1.0.1 等标签时触发
  workflow_dispatch:  # 也支持手动触发

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v3
    
    - name: 设置 Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5 pyinstaller
    
    - name: 下载 ffmpeg
      run: |
        # 下载 ffmpeg Windows 版本
        curl -L https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -o ffmpeg.zip
        unzip ffmpeg.zip
        # 复制 ffmpeg.exe 到当前目录（会在打包时包含）
        copy ffmpeg-*\bin\ffmpeg.exe ./
    
    - name: 打包 Windows exe
      run: |
        # 打包成单个 exe
        pyinstaller --onefile --windowed --name="视频音量统一工具" adjust_volume_gui.py
    
    - name: 上传构建产物
      uses: actions/upload-artifact@v3
      with:
        name: windows-exe
        path: dist/视频音量统一工具.exe
    
    - name: 创建 Release 并上传
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/视频音量统一工具.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
